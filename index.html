    <!--  Three faces, three jobs — the structure the reference runs on.
          Archivo is the grotesque that does the work; Bodoni Moda is the didone the
          wordmark and the accent words are set in; Ballet is the Spencerian script
          that titles the sections.

          All three are OFL. That is the point: the face this replaces was OPTI
          Univers, an unlicensed Univers clone that was shipping on a public URL, and
          the obvious matches for the reference (Helvetica Now, PP Editorial) are both
          commercial. Preconnect because gstatic is a second origin and the font files
          are on the critical path for a page whose first screen is almost entirely
          type. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Ballet:opsz@16..72&display=swap"
      rel="stylesheet"
    />

  </body>
